<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Visit Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: practical field tool, calm and quick, made for one thumb between clinic visits
   IDEA: a salesman's visit log book — a day page with times hanging down the margin
   PICTURE: the entry form and today's timeline are the picture
   COLOUR and TYPE: the report's own sky-blue header (#83CAEB) as the band, deep clinical teal ink, Figtree
   LAYOUT: one column on phone; form beside timeline from 900px */
:root{color-scheme:light dark;
--bg:light-dark(#f4f8fa,#0d1a20);--card:light-dark(#fff,#13242c);--ink:light-dark(#0f2a35,#e4f1f6);--mute:light-dark(#5b7380,#93acb7);
--line:light-dark(#d9e5ea,#24404b);--sky:#83caeb;--skyd:light-dark(#d9f0fa,#173847);--pri:light-dark(#0d6b8a,#5cc3e8);--prit:light-dark(#fff,#062330);
--warn:light-dark(#b4441c,#ff9a73);--ok:light-dark(#1d7a4c,#6fd6a1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--sky);color:#0a2633;padding:14px max(4vw,14px) 12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1240px;margin:auto}
h1{font-size:22px;line-height:1.1;margin:0;font-weight:800;flex:1 1 auto}
.pill{font-size:13px;background:#ffffffaa;border-radius:99px;padding:4px 10px;white-space:nowrap}
.daynav{display:flex;align-items:center;gap:6px;max-width:1240px;margin:10px auto 0}
.daynav input{flex:1;background:#fff;color:#0a2633;border:0;border-radius:10px;height:44px;padding:0 12px;font-weight:700;font-size:17px}
.ib{width:44px;height:44px;border-radius:10px;border:0;background:#ffffffb0;color:#0a2633;font-size:22px;font-weight:700;cursor:pointer}
.tbtn{height:44px;border-radius:10px;border:0;background:#0a2633;color:#fff;padding:0 14px;font-weight:700;cursor:pointer}
main{max-width:1240px;margin:auto;padding:16px max(4vw,14px) 60px;display:grid;gap:18px}
@media(min-width:900px){main{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.side{position:sticky;top:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-size:18px;margin:0 0 12px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:13px;color:var(--mute);font-weight:500}
.f{position:relative;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.in{width:100%;height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;font-size:16px}
textarea.in{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.in:focus,.ib:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:1px;border-color:var(--pri)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--skyd);border-radius:99px;padding:5px 11px;font-size:14px;cursor:pointer;min-height:32px;white-space:nowrap}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
.hint b{color:var(--ink)}
.ac{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1.5px solid var(--pri);border-radius:10px;margin:4px 0 0;padding:4px;list-style:none;max-height:290px;overflow-y:auto;box-shadow:0 12px 30px #0003}
.ac li{padding:10px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1.3}
.ac li.on,.ac li:hover{background:var(--skyd)}
.ac li.add{color:var(--pri);font-weight:700}
.ac mark{background:none;color:var(--pri);font-weight:800}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{height:48px;border-radius:12px;border:0;padding:0 18px;font-weight:800;cursor:pointer;background:var(--pri);color:var(--prit);font-size:16px}
.b.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.b.wide{flex:1}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tm{font-weight:800;font-size:17px;white-space:nowrap;color:var(--pri);text-align:right;padding-top:1px}
.cu{font-weight:800;font-size:17px;line-height:1.25}
.pu{margin-top:2px}.re{color:var(--mute);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.tag{font-size:13px;border-radius:6px;padding:2px 8px;background:var(--skyd);white-space:nowrap}
.lnk{background:none;border:0;color:var(--pri);font-weight:700;cursor:pointer;padding:6px 4px;font-size:14px;min-height:32px}
.lnk.del{color:var(--warn)}
.empty{padding:26px 6px;text-align:center;color:var(--mute)}
.due{border-left:4px solid var(--warn)}
.due li{grid-template-columns:minmax(0,1fr) auto}
details>summary{cursor:pointer;font-weight:800;font-size:17px;list-style:none;display:flex;justify-content:space-between;min-height:30px;align-items:center}
details>summary::after{content:"+";font-size:22px;color:var(--pri)}details[open]>summary::after{content:"–"}
.lst{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:240px;overflow-y:auto}
.lst .chip{background:var(--card)}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);background:#0a2633;color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center;transition:transform .25s;z-index:50;max-width:92vw;font-size:15px}
.toast.show{transform:translate(-50%,0)}.toast button{background:none;border:0;color:var(--sky);font-weight:800;cursor:pointer;min-height:32px}
.editing{outline:2px solid var(--pri)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:420px){.row{grid-template-columns:minmax(0,1fr)}.tl li{grid-template-columns:64px minmax(0,1fr)}h1{font-size:19px}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Daily Visit Report</h1><span class="pill" id="sync">Saved on this device</span></div>
  <div class="daynav">
    <button class="ib" id="prev" aria-label="Previous day">‹</button>
    <input type="date" id="day" aria-label="Report date">
    <button class="ib" id="next" aria-label="Next day">›</button>
    <button class="tbtn" id="today">Today</button>
  </div>
</header>
<main>
  <div class="side">
    <form class="card" id="form" autocomplete="off">
      <h2 id="ftitle">Add visit <small id="fday"></small></h2>
      <div class="row">
        <div class="f"><label for="time">Time</label><input class="in" type="time" id="time" required>
          <div class="chips"><button type="button" class="chip" data-t="now">Now</button><button type="button" class="chip" data-t="45">Last +45m</button></div></div>
        <div class="f"><label for="follow">Next follow-up date</label><input class="in" type="date" id="follow">
          <div class="chips"><button type="button" class="chip" data-d="2">+2 days</button><button type="button" class="chip" data-d="7">+1 week</button><button type="button" class="chip" data-d="0">Clear</button></div></div>
      </div>
      <div class="f"><label for="customer">Customer</label><input class="in" id="customer" placeholder="Start typing, e.g. dalil" required><div class="hint" id="last"></div></div>
      <div class="f"><label for="purpose">Purpose of visit</label><input class="in" id="purpose" placeholder="e.g. regular visit"><div class="chips" id="pchips"></div></div>
      <div class="f"><label for="remarks">Remarks</label><input class="in" id="remarks" placeholder="e.g. will order next week"></div>
      <div class="f"><label for="note">Note</label><input class="in" id="note" placeholder="Optional"></div>
      <div class="btns"><button class="b wide" id="save">Add visit</button><button type="button" class="b ghost" id="cancel" hidden>Cancel</button></div>
    </form>
  </div>
  <div style="display:grid;gap:18px">
    <section class="card due" id="duebox" hidden><h2>Follow-ups due <small id="duen"></small></h2><ul class="tl" id="due"></ul></section>
    <section class="card"><h2>Visits <small id="cnt"></small></h2><ul class="tl" id="list"></ul>
      <div class="btns" style="margin-top:12px"><button class="b ghost" id="copy" type="button">Copy day summary</button></div></section>
    <section class="card">
      <h2>Download Excel</h2>
      <div class="row">
        <div class="f"><label for="range">Days</label><select class="in" id="range"><option value="day">This day</option><option value="week">This week (Mon–Sun)</option><option value="month" selected>This month</option><option value="custom">Custom range</option></select></div>
        <div class="f" id="cust" hidden><label>From – to</label><div class="row"><input class="in" type="date" id="from" aria-label="From"><input class="in" type="date" id="to" aria-label="To"></div></div>
      </div>
      <button class="b" id="xl" type="button" style="width:100%">Download .xlsx</button>
      <div class="hint" id="xlmsg">One sheet per day, same columns as your report format.</div>
    </section>
    <details class="card"><summary>My lists</summary>
      <div class="hint">Paste your customer names (one per line) to add them all. New names you type in the form are added automatically.</div>
      <div class="row" style="margin-top:10px"><div class="f"><label for="ltype">List</label><select class="in" id="ltype"><option value="customers">Customers</option><option value="purposes">Purposes</option><option value="remarks">Remarks</option><option value="notes">Notes</option></select></div>
      <div class="f"><label for="lfilter">Search list</label><input class="in" id="lfilter" placeholder="Filter"></div></div>
      <textarea class="in" id="paste" placeholder="Al Dalil Medical Center&#10;Starcare Medical Center LLC&#10;…"></textarea>
      <div class="btns" style="margin-top:8px"><button class="b" type="button" id="addall">Add to list</button></div>
      <div class="hint" id="lcount"></div><div class="lst" id="lst"></div>
    </details>
  </div>
</main>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tact" hidden>Undo</button></div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
{
const SEED={
customers:["360 Medical Centre","Ajmal Basmah Dental Clinic","Al Amal Dental Lab","Al Dalil Medical Center","Al Durrah Radiology","Al Husn Medical Center (Dhaid)","Al Maher Medical Center","Al Minha Medical Centre","Al Nahda Medical Centre","Al Nawras Dental Centre","Al Saha Wa Al Shifaa One Day Surgery Hospital","Al Salam Medical Centre","Al Shifa Medical Centre","Al Taj Al Fadhi Clinic","Al Wazn Al Methali Medical Center","Bab Khyber Medical Center","Baghdad Medical Center","Canadian Medical Centre","City Gate Medical Centre","Conceive (The Gynaecology & Fertility Hospital)","Dallas Medical Centre","Delta Dental Clinic","Diana Dental Clinic","Dr Al Kamal","Dr Faiza Al Ali Medical Centre","Dr Fathima Nooh Medical Center","Dr Fawzia Aljeziri Medical Center LLC","Dr Sunny Medical","Dr Thomas Dental Clinic","Dr Zainab Salim","Elite Smile","Eve Medical Center","Family Dental Center LLC","Family Star Medical Center","Hans Medical Center","Healers Medical Center LLC (Shj)","Ideal Medical Centre","Jessy Clinic","Karima Medical Center LLC","Kings Dental Clinic","Liberty Medical Center","Limar","Lyla Dental Clinic","Marvellous Medical Center","Methawi Medical Centre","Nadeem Medical Center","Nafeesa Medical Centre","Nathani Medical Centre","New Hope Gynaecology and Fertility Hospital LLC","Noushad Khatiri","Oriana Hospital for One Day Surgery","Peshawar Medical Center","Prestige Dental Center","Rayhan Gulf Medical Center","Regal Medical Center","Rekha's Dental Center","Riaz Specialist Medical Center","Right Medical Centre","Sabah Al Noor Medical Center","Safaa Poly Clinic LLC","Sajida Medical Center","Sasils Medical Centre","Shifa Muwella","Shiyas & Ifthikar Medical Centre","Smile Medical Center","Starcare Medical Center LLC","Tulip","Office","Cash Sales"],
purposes:["Regular visit","New customer","New customer, met doctor","New customer, met purchase manager","Old customer","Met doctor","Met purchase manager","Met nurse","Purchase manager was absent","Introduced products","Sent the catalog","Met doctor and sent the catalog","Product enquiry","Got enquiry","Enquired price of products","Got order","Back order request","Requested sample","Sample delivered","Clearing SOA","Payment collection","Account clearance of an order","Quotation submitted","Follow-up visit","Closed","Doctor on vacation","Meeting","Meeting with HR","Car handover"],
remarks:["Interested, will order","Will order next week","Asked for quotation","Quotation sent","Price is high","Comparing with other supplier","Using another supplier","Needs sample first","Payment pending","Payment collected","Cheque to collect","Call back later","Decision maker absent","Not interested now","Order confirmed"],
notes:["Delayed due to sample collection","Traffic delay","Office work","Delivery follow-up"]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=k=>{const d=parse(k);return d.getDate()+' '+MON[d.getMonth()]};
const niceW=k=>parse(k).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fmtT=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return h+'.'+pad(m)+ap};
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9& ]+/g,' ').replace(/\b(centre|cntre|cdntre)\b/g,'center').replace(/\s+/g,' ').trim();
const uid=()=>Math.random().toString(36).slice(2,10);

let S={days:{},lists:JSON.parse(JSON.stringify(SEED)),use:{}};
try{const r=localStorage.getItem('dvr1');if(r){const o=JSON.parse(r);S.days=o.days||{};if(o.lists)S.lists=o.lists;S.use=o.use||{}}}catch(e){}
let cur=key(new Date()),editId=null,db=null,coll=null;
const local=()=>{try{localStorage.setItem('dvr1',JSON.stringify(S))}catch(e){}};

/* ---- cloud save (your private space in this page) ---- */
const queue={},timers={};
function push(doc,body){if(!coll)return;clearTimeout(timers[doc]);timers[doc]=setTimeout(()=>{
  queue[doc]=(queue[doc]||Promise.resolve()).then(()=>coll.doc(doc).set(body)).then(()=>syncMsg('Saved to your account',1)).catch(()=>syncMsg('Saved on this device only'))},600)}
function syncMsg(t){$('sync').textContent=t}
function persistDay(k){local();push('d-'+k,{date:k,rows:S.days[k]||[]})}
function persistLists(){local();push('lists',{lists:S.lists,use:S.use})}
(async()=>{try{
  const [d,u]=await Promise.all([window.claude?.use?.('db'),window.claude?.use?.('user')]);
  if(!d||!u)return;const id=await u.id();if(!id)return;
  db=d;coll=db.collection('data/users/'+id);syncMsg('Loading…');
  const t=setTimeout(()=>syncMsg('Saved on this device only'),10000);
  const snap=await coll.get();clearTimeout(t);
  if(snap.empty){for(const k in S.days)persistDay(k);persistLists();syncMsg('Saved to your account');return}
  for(const doc of snap.docs){const b=doc.data();if(!b)continue;
    if(doc.id==='lists'){if(b.lists)S.lists=b.lists;S.use=b.use||{}}
    else if(doc.id.startsWith('d-')&&Array.isArray(b.rows))S.days[b.date]=b.rows}
  local();render();syncMsg('Saved to your account');
}catch(e){syncMsg('Saved on this device only')}})();

/* ---- learning lists ---- */
function learn(list,v){v=String(v||'').trim();if(!v)return;const n=norm(v);
  if(!S.lists[list].some(x=>norm(x)===n))S.lists[list].push(v);
  const k=list+':'+n;S.use[k]=(S.use[k]||0)+1}

/* ---- autocomplete ---- */
function score(item,q,list){const n=norm(item);let s=0;
  if(!q)s=1;else if(n.startsWith(q))s=100;else{const qt=q.split(' '),w=n.split(' ');
    if(qt.every(t=>w.some(x=>x.startsWith(t))))s=80;else if(n.includes(q))s=60;else if(qt.every(t=>n.includes(t)))s=40}
  return s?s+Math.min(30,(S.use[list+':'+n]||0)*3):0}
function hl(item,q){if(!q)return esc(item);const i=item.toLowerCase().indexOf(q.split(' ')[0]);
  if(i<0)return esc(item);const L=q.split(' ')[0].length;return esc(item.slice(0,i))+'<mark>'+esc(item.slice(i,i+L))+'</mark>'+esc(item.slice(i+L))}
function ac(input,list,onPick){const ul=document.createElement('ul');ul.className='ac';ul.hidden=true;input.after(ul);let items=[],on=-1;
  const show=()=>{const raw=input.value.trim(),q=norm(raw);
    items=S.lists[list].map(x=>[x,score(x,q,list)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,8).map(x=>x[0]);
    const exact=items.some(x=>norm(x)===q);const extra=raw&&!exact&&list==='customers';
    if(!items.length&&!extra){ul.hidden=true;return}
    on=-1;ul.innerHTML=items.map((x,i)=>`<li data-i="${i}">${hl(x,q)}</li>`).join('')+(extra?`<li class="add" data-i="new">+ Add “${esc(raw)}” as new customer</li>`:'');ul.hidden=false};
  const pick=i=>{if(i==='new'){learn(list,input.value);persistLists()}else input.value=items[i];ul.hidden=true;onPick&&onPick()};
  input.addEventListener('input',show);input.addEventListener('focus',show);
  input.addEventListener('blur',()=>setTimeout(()=>ul.hidden=true,150));
  ul.addEventListener('mousedown',e=>{const li=e.target.closest('li');if(li){e.preventDefault();pick(li.dataset.i)}});
  input.addEventListener('keydown',e=>{if(ul.hidden)return;const lis=[...ul.children];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();on=(on+(e.key==='ArrowDown'?1:-1)+lis.length)%lis.length;lis.forEach((l,i)=>l.classList.toggle('on',i===on));lis[on].scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'&&on>=0){e.preventDefault();pick(lis[on].dataset.i)}else if(e.key==='Escape')ul.hidden=true})}
ac($('customer'),'customers',()=>{lastHint();$('purpose').focus()});
ac($('purpose'),'purposes',()=>$('remarks').focus());
ac($('remarks'),'remarks',()=>$('follow').focus());
ac($('note'),'notes');
$('customer').addEventListener('change',lastHint);

function lastVisit(c){const n=norm(c);let best=null;
  for(const k in S.days)for(const r of S.days[k])if(norm(r.customer)===n&&r.id!==editId&&(!best||k+r.time>best.k+best.r.time))best={k,r};return best}
function lastHint(){const c=$('customer').value.trim(),h=$('last');const b=c&&lastVisit(c);
  h.innerHTML=b?`Last visit <b>${esc(nice(b.k))}</b> · ${esc(b.r.purpose||'—')}${b.r.remarks?' · '+esc(b.r.remarks):''}`:''}

function pchips(){const top=S.lists.purposes.map(p=>[p,S.use['purposes:'+norm(p)]||0]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  $('pchips').innerHTML=top.map(([p])=>`<button type="button" class="chip">${esc(p)}</button>`).join('')}
$('pchips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){$('purpose').value=b.textContent;$('remarks').focus()}});

/* ---- time & follow-up chips ---- */
const nowT=()=>{const d=new Date();const m=Math.round(d.getMinutes()/5)*5;d.setMinutes(m);return pad(d.getHours())+':'+pad(d.getMinutes())};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(b.dataset.t==='now'){$('time').value=nowT();return}
  const rows=S.days[cur]||[];if(!rows.length){$('time').value='09:30';return}
  const l=rows.map(r=>r.time).sort().pop();let[h,m]=l.split(':').map(Number);m+=45;h+=Math.floor(m/60);$('time').value=pad(Math.min(h,23))+':'+pad(m%60)});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{$('follow').value=+b.dataset.d?addD(cur,+b.dataset.d):''});

/* ---- form ---- */
const F=['time','customer','purpose','remarks','follow','note'];
function resetForm(){editId=null;F.forEach(f=>$(f).value='');$('time').value=cur===key(new Date())?nowT():'';
  $('save').textContent='Add visit';$('ftitle').firstChild.textContent='Add visit ';$('cancel').hidden=true;$('form').classList.remove('editing');$('last').innerHTML=''}
$('form').addEventListener('submit',e=>{e.preventDefault();
  const r={id:editId||uid()};F.forEach(f=>r[f]=$(f).value.trim());
  if(!r.customer){$('customer').focus();return}
  learn('customers',r.customer);learn('purposes',r.purpose);learn('remarks',r.remarks);learn('notes',r.note);
  const rows=S.days[cur]=S.days[cur]||[];const i=rows.findIndex(x=>x.id===r.id);
  if(i>=0)rows[i]=r;else rows.push(r);
  toast(i>=0?'Visit updated':'Visit added');
  persistDay(cur);persistLists();resetForm();render();$('customer').focus()});
$('cancel').onclick=()=>{resetForm()};

/* ---- render ---- */
function rowHTML(r,acts){return `<li><div class="tm">${esc(fmtT(r.time)||'—')}</div><div><div class="cu">${esc(r.customer)}</div>
  ${r.purpose?`<div class="pu">${esc(r.purpose)}</div>`:''}${r.remarks?`<div class="re">${esc(r.remarks)}</div>`:''}
  <div class="tags">${r.follow?`<span class="tag">Follow-up ${esc(nice(r.follow))}</span>`:''}${r.note?`<span class="tag">Note: ${esc(r.note)}</span>`:''}${acts}</div></div></li>`}
function render(){
  $('day').value=cur;$('fday').textContent=niceW(cur);
  const rows=(S.days[cur]||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  $('cnt').textContent=rows.length+(rows.length===1?' visit':' visits');
  $('list').innerHTML=rows.length?rows.map(r=>rowHTML(r,`<button class="lnk" data-e="${esc(r.id)}">Edit</button><button class="lnk del" data-x="${esc(r.id)}">Delete</button>`)).join('')
    :`<li style="display:block"><div class="empty">No visits on ${esc(niceW(cur))} yet. Add your first one with the form.</div></li>`;
  const due=[];for(const k in S.days)if(k!==cur)for(const r of S.days[k])if(r.follow===cur)due.push({k,r});
  $('duebox').hidden=!due.length;$('duen').textContent=due.length+' due';
  $('due').innerHTML=due.map(({k,r})=>`<li><div><div class="cu">${esc(r.customer)}</div><div class="re">Visited ${esc(nice(k))}${r.purpose?' · '+esc(r.purpose):''}${r.remarks?' · '+esc(r.remarks):''}</div></div><button class="lnk" data-c="${esc(r.customer)}">Log visit</button></li>`).join('');
  pchips();lists()}
$('list').addEventListener('click',e=>{const ed=e.target.closest('[data-e]'),dx=e.target.closest('[data-x]');const rows=S.days[cur]||[];
  if(ed){const r=rows.find(x=>x.id===ed.dataset.e);if(!r)return;editId=r.id;F.forEach(f=>$(f).value=r[f]||'');
    $('save').textContent='Save changes';$('ftitle').firstChild.textContent='Edit visit ';$('cancel').hidden=false;$('form').classList.add('editing');lastHint();$('form').scrollIntoView({behavior:'smooth',block:'start'})}
  if(dx){const i=rows.findIndex(x=>x.id===dx.dataset.x);if(i<0)return;const[gone]=rows.splice(i,1);const day=cur;persistDay(day);render();
    toast('Visit deleted',()=>{(S.days[day]=S.days[day]||[]).push(gone);persistDay(day);render()})}});
$('due').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;resetForm();$('customer').value=b.dataset.c;$('purpose').value='Follow-up visit';lastHint();$('form').scrollIntoView({behavior:'smooth'});$('remarks').focus()});

/* ---- day nav ---- */
const go=k=>{if(!k)return;cur=k;resetForm();render()};
$('prev').onclick=()=>go(addD(cur,-1));$('next').onclick=()=>go(addD(cur,1));$('today').onclick=()=>go(key(new Date()));
$('day').onchange=e=>go(e.target.value);

/* ---- toast ---- */
let tt;function toast(m,undo){$('tmsg').textContent=m;$('tact').hidden=!undo;$('tact').onclick=()=>{undo&&undo();$('toast').classList.remove('show')};
  $('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),undo?6000:2200)}

/* ---- copy summary ---- */
$('copy').onclick=async()=>{const rows=(S.days[cur]||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if(!rows.length){toast('No visits to copy');return}
  const txt='Daily report – '+niceW(cur)+'\n'+rows.map((r,i)=>`${i+1}. ${fmtT(r.time)} – ${r.customer}${r.purpose?' – '+r.purpose:''}${r.remarks?' ('+r.remarks+')':''}${r.follow?' – follow-up '+nice(r.follow):''}`).join('\n');
  try{await navigator.clipboard.writeText(txt);toast('Summary copied')}catch(e){toast('Copy not allowed here')}};

/* ---- lists manager ---- */
function lists(){const t=$('ltype').value,q=norm($('lfilter').value);const all=S.lists[t].slice().sort((a,b)=>a.localeCompare(b));
  const sh=all.filter(x=>!q||norm(x).includes(q));$('lcount').textContent=all.length+' saved'+(q?' · '+sh.length+' match':'');
  $('lst').innerHTML=sh.slice(0,300).map(x=>`<span class="chip">${esc(x)} <button class="lnk del" style="padding:0 2px" data-r="${esc(x)}" aria-label="Remove">×</button></span>`).join('')}
$('ltype').onchange=lists;$('lfilter').oninput=lists;
$('addall').onclick=()=>{const t=$('ltype').value;const before=S.lists[t].length;
  $('paste').value.split(/\n|,(?=\s*[A-Za-z])/).map(s=>s.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean).forEach(v=>{if(!S.lists[t].some(x=>norm(x)===norm(v)))S.lists[t].push(v)});
  const n=S.lists[t].length-before;$('paste').value='';persistLists();lists();toast(n+' added')};
$('lst').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const t=$('ltype').value;S.lists[t]=S.lists[t].filter(x=>x!==b.dataset.r);persistLists();lists()});

/* ---- Excel export ---- */
$('range').onchange=()=>{$('cust').hidden=$('range').value!=='custom';if(!$('from').value){$('from').value=cur.slice(0,8)+'01';$('to').value=cur}};
function rangeKeys(){const v=$('range').value;let a,b;
  if(v==='day'){a=b=cur}else if(v==='week'){const wd=(parse(cur).getDay()+6)%7;a=addD(cur,-wd);b=addD(a,6)}
  else if(v==='month'){a=cur.slice(0,8)+'01';const d=parse(a);d.setMonth(d.getMonth()+1,0);b=key(d)}else{a=$('from').value;b=$('to').value}
  if(!a||!b)return[];if(a>b)[a,b]=[b,a];const out=[];for(let k=a;k<=b&&out.length<400;k=addD(k,1))out.push(k);return out}
$('xl').onclick=async()=>{const msg=$('xlmsg');
  if(!window.ExcelJS){msg.textContent='Excel library did not load. Check your connection and try again.';return}
  const days=rangeKeys().filter(k=>(S.days[k]||[]).length);if(!days.length){msg.textContent='No visits in those days to export.';return}
  const wb=new ExcelJS.Workbook();const used=new Set();
  const H=[' DATE','TIME','CUSTOMER','PURPOSE OF VISIT','REMARKS','NEXT FOLLOWUP DATE','NOTE'],W=[14,11,34,32,30,20,36];
  const bd={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
  for(const k of days){const d=parse(k);let nm=d.getDate()+' '+MON[d.getMonth()].toLowerCase();if(used.has(nm))nm+=' '+d.getFullYear();used.add(nm);
    const ws=wb.addWorksheet(nm);ws.columns=W.map(w=>({width:w}));
    const hr=ws.addRow(H);hr.eachCell(c=>{c.font={bold:true};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF83CAEB'}};c.border=bd;c.alignment={vertical:'middle'}});
    for(const r of S.days[k].slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''))){
      const row=ws.addRow([new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),fmtT(r.time),r.customer,r.purpose,r.remarks,r.follow?new Date(Date.UTC(...r.follow.split('-').map((x,i)=>+x-(i===1?1:0)))):null,r.note]);
      row.getCell(1).numFmt='dd/mm/yyyy';row.getCell(6).numFmt='dd/mm/yyyy';row.eachCell({includeEmpty:true},c=>{c.border=bd;c.alignment={vertical:'top',wrapText:true}})}
    ws.views=[{state:'frozen',ySplit:1}]}
  const buf=await wb.xlsx.writeBuffer();const a=parse(days[0]),b=parse(days[days.length-1]);
  const fn='DAILY_REPORT_'+(days.length===1?a.getDate()+'-'+MON[a.getMonth()]:a.getDate()+MON[a.getMonth()]+'-'+b.getDate()+MON[b.getMonth()])+'-'+b.getFullYear()+'.xlsx';
  msg.textContent='Preparing '+fn+'…';
  try{const dl=await window.claude?.use?.('downloads');
    if(dl){await dl.save({filename:fn,data:buf});msg.textContent='Saved '+fn+' ('+days.length+(days.length>1?' sheets)':' sheet)');return}
  }catch(e){if(e&&e.code==='declined'){msg.textContent='Download cancelled.';return}
    if(e&&e.code==='host_unavailable'){msg.textContent='This app cannot save files. Open this page in a browser to download.';return}}
  try{const u=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));const l=document.createElement('a');l.href=u;l.download=fn;document.body.append(l);l.click();l.remove();msg.textContent='Downloading '+fn}
  catch(e){msg.textContent='Download is blocked here. Open this page in a browser.'}};

resetForm();render();
}
</script>
</body>
